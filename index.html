<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的故事</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a1f 0%, #2d1b3d 25%, #4a2c5a 50%, #1f0f24 100%);
            font-family: 'Noto Serif SC', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 光晕背景 */
        .glow-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: orbFloat 15s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(180, 80, 150, 0.4), transparent);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(120, 60, 180, 0.35), transparent);
            bottom: -80px;
            right: -80px;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(200, 100, 130, 0.3), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* 闪烁星星 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        .star:nth-child(1) { top: 8%; left: 12%; animation-delay: 0s; }
        .star:nth-child(2) { top: 15%; left: 25%; animation-delay: 0.4s; }
        .star:nth-child(3) { top: 6%; left: 45%; animation-delay: 0.8s; }
        .star:nth-child(4) { top: 22%; left: 60%; animation-delay: 1.2s; }
        .star:nth-child(5) { top: 12%; left: 78%; animation-delay: 1.6s; }
        .star:nth-child(6) { top: 28%; left: 90%; animation-delay: 2s; }
        .star:nth-child(7) { top: 5%; left: 88%; animation-delay: 0.3s; }
        .star:nth-child(8) { top: 18%; left: 8%; animation-delay: 1s; }
        .star:nth-child(9) { top: 32%; left: 35%; animation-delay: 1.8s; }
        .star:nth-child(10) { top: 10%; left: 70%; animation-delay: 0.6s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.3); }
        }

        /* 浮动心形 */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 18px;
            animation: floatHeart 12s infinite ease-in-out;
            opacity: 0.5;
        }

        .heart:nth-child(1) { left: 5%; animation-delay: 0s; }
        .heart:nth-child(2) { left: 18%; animation-delay: 2s; font-size: 22px; }
        .heart:nth-child(3) { left: 32%; animation-delay: 4s; font-size: 16px; }
        .heart:nth-child(4) { left: 48%; animation-delay: 6s; font-size: 20px; }
        .heart:nth-child(5) { left: 62%; animation-delay: 3s; font-size: 24px; }
        .heart:nth-child(6) { left: 78%; animation-delay: 5s; }
        .heart:nth-child(7) { left: 92%; animation-delay: 7s; font-size: 26px; }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            background: linear-gradient(145deg, rgba(60, 30, 70, 0.6), rgba(40, 20, 50, 0.7));
            backdrop-filter: blur(30px);
            border-radius: 35px;
            padding: 55px 50px;
            text-align: center;
            max-width: 620px;
            margin: 20px;
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                0 0 120px rgba(150, 80, 140, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: containerPulse 6s ease-in-out infinite;
        }

        @keyframes containerPulse {
            0%, 100% { 
                box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 0 100px rgba(150, 80, 140, 0.1);
            }
            50% { 
                box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 0 130px rgba(150, 80, 140, 0.2);
            }
        }

        /* 标题 */
        h1 {
            font-size: 3.5em;
            background: linear-gradient(135deg, #f8d7da 0%, #e8a4b8 30%, #d4a5c9 60%, #c9a0dc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: 25px;
            filter: drop-shadow(0 3px 15px rgba(200, 150, 180, 0.4));
        }

        /* 副标题 */
        .subtitle {
            color: rgba(220, 180, 200, 0.85);
            font-size: 1em;
            margin-bottom: 40px;
            letter-spacing: 10px;
            text-transform: uppercase;
        }

        /* 名字区域 */
        .couple-names {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .person {
            background: linear-gradient(135deg, rgba(180, 100, 150, 0.25), rgba(120, 70, 130, 0.2));
            padding: 18px 35px;
            border-radius: 50px;
            border: 1px solid rgba(200, 150, 180, 0.3);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .person::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .person:hover::before {
            left: 100%;
        }

        .person:hover {
            transform: scale(1.05);
            border-color: rgba(200, 150, 180, 0.5);
            box-shadow: 0 10px 30px rgba(150, 80, 130, 0.3);
        }

        .person-name {
            font-size: 1.5em;
            background: linear-gradient(135deg, #f0c4d0, #e0b0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
            letter-spacing: 3px;
        }

        .couple-heart {
            font-size: 2.2em;
            animation: heartbeat 1.2s infinite;
            filter: drop-shadow(0 0 10px rgba(255, 150, 180, 0.5));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.35); }
            30% { transform: scale(1); }
            50% { transform: scale(1.2); }
            70% { transform: scale(1); }
        }

        /* 情话区域 */
        .love-words {
            background: linear-gradient(135deg, rgba(100, 50, 90, 0.3), rgba(80, 40, 70, 0.25));
            border-radius: 25px;
            padding: 35px 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(200, 150, 180, 0.15);
            position: relative;
        }

        .love-words::before {
            content: '"';
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 3em;
            color: rgba(200, 150, 180, 0.2);
            font-family: Georgia, serif;
        }

        .love-words p {
            color: rgba(240, 210, 220, 0.95);
            font-size: 1.15em;
            line-height: 2.3;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }

        .love-words p:last-child {
            margin-bottom: 0;
        }

        .love-words p:nth-child(1) { animation-delay: 0.2s; }
        .love-words p:nth-child(2) { animation-delay: 0.5s; }
        .love-words p:nth-child(3) { animation-delay: 0.8s; }
        .love-words p:nth-child(4) { animation-delay: 1.1s; }
        .love-words p:nth-child(5) { animation-delay: 1.4s; }
        .love-words p:nth-child(6) { animation-delay: 1.7s; }

        .love-words .highlight {
            background: linear-gradient(135deg, rgba(220, 150, 180, 0.3), rgba(200, 130, 160, 0.2));
            padding: 2px 8px;
            border-radius: 5px;
            color: #f5d0dc;
            font-weight: 500;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 承诺区域 */
        .promise-section {
            margin: 35px 0;
            padding: 25px;
            background: linear-gradient(135deg, rgba(150, 80, 120, 0.2), rgba(100, 50, 80, 0.15));
            border-radius: 20px;
            border-left: 3px solid rgba(200, 130, 160, 0.4);
        }

        .promise-text {
            font-size: 1.05em;
            color: rgba(230, 200, 215, 0.95);
            line-height: 2;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .promise-text span {
            color: #f0c0d0;
            font-weight: 600;
        }

        /* 时间线 */
        .timeline {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
            padding: 22px 20px;
            background: rgba(80, 40, 70, 0.25);
            border-radius: 20px;
            border: 1px solid rgba(180, 120, 150, 0.15);
        }

        .timeline-item {
            text-align: center;
            color: rgba(230, 200, 215, 0.9);
            padding: 10px 15px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            background: rgba(150, 80, 120, 0.2);
        }

        .timeline-icon {
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #e0a8c0;
        }

        .timeline-label {
            font-size: 0.85em;
            opacity: 0.75;
        }

        .timeline-arrow {
            color: rgba(180, 130, 160, 0.5);
            font-size: 1.3em;
        }

        /* 签名 */
        .signature {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(180, 130, 160, 0.2);
        }

        .signature-text {
            color: rgba(220, 190, 210, 0.9);
            font-size: 1.05em;
            font-style: italic;
            margin-bottom: 10px;
        }

        .signature-date {
            color: rgba(180, 150, 170, 0.7);
            font-size: 0.9em;
            letter-spacing: 2px;
        }

        /* 图片容器 */
        .image-container {
            margin-top: 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
            border: 1px solid rgba(180, 130, 160, 0.2);
        }

        .image-container:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .image-container img {
            width: 100%;
            max-width: 280px;
            display: block;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container { padding: 40px 30px; }
            h1 { font-size: 2.8em; letter-spacing: 15px; }
            .couple-names { flex-direction: column; gap: 12px; }
            .person { padding: 14px 28px; }
            .love-words { padding: 28px 22px; }
            .love-words p { font-size: 1.05em; }
            .timeline { flex-wrap: wrap; gap: 10px; }
        }
    </style>
</head>
<body>
    <!-- 光晕背景 -->
    <div class="glow-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- 星星 -->
    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <!-- 浮动心形 -->
    <div class="floating-hearts">
        <div class="heart">💜</div>
        <div class="heart">💗</div>
        <div class="heart">💖</div>
        <div class="heart">💜</div>
        <div class="heart">💗</div>
        <div class="heart">💖</div>
        <div class="heart">💜</div>
    </div>

    <div class="container">
        <h1>家</h1>
        <div class="subtitle">我们的故事</div>

        <!-- 名字展示 -->
        <div class="couple-names">
            <div class="person">
                <span class="person-name">蒋灿宇</span>
            </div>
            <span class="couple-heart">💕</span>
            <div class="person">
                <span class="person-name">信凯元</span>
            </div>
        </div>

        <!-- 情话 -->
        <div class="love-words">
            <p>我习惯在深夜将你揽入怀中</p>
            <p>感受你温热的体温透过薄衣传来</p>
            <p>你微微蜷缩着，像只慵懒的猫</p>
            <p>我低头埋进你的颈窝，嗅着你身上的气息</p>
            <p><span class="highlight">你轻声呢喃着我的名字</span></p>
            <p>那一刻，我只想将你揉进骨血里</p>
        </div>

        <!-- 承诺 -->
        <div class="promise-section">
            <p class="promise-text">
                <span>灿宇</span> 在 <span>凯元</span> 耳畔低语：<br>
                你的锁骨、你的腰线、你的一切<br>
                我都比自己更清楚<br>
                余生，我只想独占你的每一寸温柔
            </p>
        </div>

        <!-- 时间线 -->
        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-icon">初见</div>
                <div class="timeline-label">一眼万年</div>
            </div>
            <span class="timeline-arrow">→</span>
            <div class="timeline-item">
                <div class="timeline-icon">沦陷</div>
                <div class="timeline-label">无法自拔</div>
            </div>
            <span class="timeline-arrow">→</span>
            <div class="timeline-item">
                <div class="timeline-icon">痴缠</div>
                <div class="timeline-label">至死方休</div>
            </div>
        </div>

        <!-- 签名 -->
        <div class="signature">
            <p class="signature-text">"我贪恋你的一切，从发梢到足尖"</p>
            <p class="signature-date">—— 蒋灿宇 × 信凯元 · 一世相守</p>
        </div>

        <!-- 图片 -->
        <div class="image-container">
            <img src="c291dec04bc523d5ad221f085b0fda3c.jpg" alt="我们的家">
        </div>
    </div>
</body>
</html>
